{% extends "master.html" %}

{% block content %}
<div class="mx-auto flex min-h-[calc(100vh-12rem)] max-w-md items-center px-4 py-12 sm:px-6">
    <div class="w-full rounded-2xl border border-slate-200 bg-white p-8 shadow-xl shadow-slate-200/50">
        <span class="flex h-12 w-12 items-center justify-center rounded-xl bg-gradient-to-br from-blue-600 to-indigo-600 text-white shadow-lg shadow-blue-200">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/>
            </svg>
        </span>

        <h1 class="mt-5 text-3xl font-bold tracking-tight text-slate-900">Create your account</h1>
        <p class="mt-1 text-sm text-slate-500">Start booking premium cars in seconds.</p>

        {% if error %}
        <div class="mt-4 rounded-xl border border-red-100 bg-red-50 p-4 text-sm text-red-600">
            {{ error }}
        </div>
        {% endif %}

        <form action="/register" method="POST" class="mt-6 space-y-4">
            <div>
                <label for="name" class="block text-sm font-medium text-slate-700">Full name</label>
                <input 
                    type="text" 
                    id="name"
                    name="name" 
                    class="mt-1.5 block w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm transition-colors focus:border-blue-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20" 
                    placeholder="Enter your full name" 
                    required
                >
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700">Phone</label>
                <input 
                    type="text" 
                    name="phone"
                    class="mt-1.5 block w-full rounded-xl border px-4 py-3"
                    placeholder="0812345678"
                    required
                >
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-slate-700">Email address</label>
                <input 
                    type="email" 
                    id="email"
                    name="email" 
                    class="mt-1.5 block w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm transition-colors focus:border-blue-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20" 
                    placeholder="name@example.com" 
                    required
                >
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
                <input 
                    type="password" 
                    id="password"
                    name="password" 
                    class="mt-1.5 block w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm transition-colors focus:border-blue-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20" 
                    placeholder="Create a password" 
                    required 
                    minlength="6"
                >
            </div>

            <button 
                type="submit" 
                class="flex w-full items-center justify-center rounded-xl bg-slate-900 px-4 py-3 text-sm font-semibold text-white shadow-lg transition-all hover:bg-slate-800 active:scale-[0.98]"
            >
                Create account
            </button>
        </form>

        <p class="mt-8 text-center text-sm text-slate-500">
            Have an account? 
            <a href="/login" class="font-semibold text-blue-600 hover:text-blue-700 hover:underline">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
